[package]
name = "dither-ratatui"
description = "Dithered charts, buttons, gradients and backgrounds for Ratatui terminal apps."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["dither", "ratatui", "tui", "terminal", "widgets"]
categories = ["command-line-interface", "graphics", "visualization"]

[dependencies]
dither-core.workspace = true
ratatui = "0.30.1"
miniz_oxide = "0.8"

[features]
default = ["crossterm"]
# Reads the terminal's cell size in pixels for kitty graphics detection.
crossterm = ["ratatui/crossterm"]

[dev-dependencies]
crossterm = "0.29"
